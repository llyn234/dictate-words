<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听写小助手 | Dictation Pal</title>
    <style>
        :root {
            --primary: #48dbfb;
            --primary-dark: #0abde3;
            --accent: #ff9f43;
            --bg: #f7f1e3;
            --card: #ffffff;
            --text: #2c3e50;
            --success: #1dd1a1;
            --error: #ff6b6b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 { margin-top: 0; color: var(--text); font-size: 1.8rem; }
        .subtitle { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 20px; }

        /* --- 1. 设置页 --- */
        .setup-section textarea {
            width: 100%;
            height: 150px;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 15px;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
            margin-bottom: 15px;
        }
        .setup-section textarea:focus { outline: none; border-color: var(--primary); }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        .setting-item label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: #666; }
        .setting-item select, .setting-item input {
            width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ddd;
        }

        /* --- 2. 听写页 --- */
        .practice-section { display: none; }
        
        .progress-bar {
            width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-bottom: 20px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: var(--primary); width: 0%; transition: width 0.3s;
        }

        .speaker-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--primary); color: white; border: none;
            font-size: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(72, 219, 251, 0.4);
            transition: transform 0.1s; margin: 20px auto; display: flex; align-items: center; justify-content: center;
        }
        .speaker-btn:active { transform: scale(0.95); }
        .speaker-btn.playing { animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(72, 219, 251, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(72, 219, 251, 0); }
            100% { box-shadow: 0 0 0 0 rgba(72, 219, 251, 0); }
        }

        .input-box {
            width: 80%; padding: 12px; font-size: 1.2rem; text-align: center;
            border: 2px solid #ddd; border-radius: 10px; margin-bottom: 15px;
        }
        .input-box.correct { border-color: var(--success); background: #eafff5; color: var(--success); }
        .input-box.wrong { border-color: var(--error); background: #fff0f0; color: var(--error); }

        .answer-display {
            font-size: 1.5rem; font-weight: bold; height: 40px; margin-bottom: 20px;
            color: var(--text); visibility: hidden;
        }
        .answer-display.visible { visibility: visible; }

        /* --- 3. 结果页 --- */
        .result-section { display: none; }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%; border: 8px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: bold; margin: 0 auto 20px; color: var(--primary);
        }
        .word-list { text-align: left; max-height: 300px; overflow-y: auto; }
        .word-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .word-item.wrong { color: var(--error); }
        .word-item.correct { color: var(--success); }

        /* 通用按钮 */
        .btn {
            background: var(--primary-dark); color: white; border: none;
            padding: 12px 30px; border-radius: 25px; font-size: 1rem; cursor: pointer;
            width: 100%; max-width: 200px; font-weight: bold; margin-top: 10px;
        }
        .btn-secondary { background: #95a5a6; }
        .btn-outline { background: transparent; border: 2px solid var(--primary-dark); color: var(--primary-dark); }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }

        /* 提示 */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 20px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 听写小助手</h1>
    <div class="subtitle">家长省心，孩子开心的听写神器</div>

    <!-- 1. 设置页面 -->
    <div id="setupPage" class="setup-section">
        <textarea id="wordInput" placeholder="在此粘贴单词，用逗号、空格或换行隔开。&#10;例如：&#10;apple, banana, orange&#10;computer science&#10;你好, 世界"></textarea>
        
        <div class="settings-grid">
            <div class="setting-item">
                <label>🗣️ 朗读速度</label>
                <select id="speedSelect">
                    <option value="0.7">慢速 (0.7x)</option>
                    <option value="1" selected>正常 (1.0x)</option>
                    <option value="1.3">快速 (1.3x)</option>
                </select>
            </div>
            <div class="setting-item">
                <label>🔄 重复次数</label>
                <select id="repeatSelect">
                    <option value="1">读 1 遍</option>
                    <option value="2" selected>读 2 遍</option>
                    <option value="3">读 3 遍</option>
                </select>
            </div>
            <div class="setting-item">
                <label>🌍 语言模式</label>
                <select id="langSelect">
                    <option value="auto">自动识别</option>
                    <option value="en-US">英语 (English)</option>
                    <option value="zh-CN">中文 (普通话)</option>
                </select>
            </div>
            <div class="setting-item">
                <label>⚙️ 模式</label>
                <select id="modeSelect">
                    <option value="manual">手动点击下一词</option>
                    <option value="auto">自动播放 (间隔5秒)</option>
                </select>
            </div>
        </div>

        <button class="btn" onclick="startDictation()">🚀 开始听写</button>
        <div style="margin-top:15px; font-size: 0.8rem; color: #999;">💡 提示：支持电脑和手机，无需联网</div>
    </div>

    <!-- 2. 听写进行中页面 -->
    <div id="practicePage" class="practice-section">
        <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
        <div style="color: #888; margin-bottom: 10px;">Word <span id="currentIndexDisplay">1</span> / <span id="totalCountDisplay">10</span></div>

        <!-- 喇叭按钮 -->
        <button class="speaker-btn" id="speakerBtn" onclick="speakCurrentWord()">🔊</button>
        <div style="font-size: 0.9rem; color: #aaa; margin-bottom: 20px;">点击喇叭重读</div>

        <!-- 拼写输入框 -->
        <input type="text" id="spellInput" class="input-box" placeholder="在此输入拼写 (可选)" autocomplete="off">
        
        <!-- 答案显示区 -->
        <div id="answerDisplay" class="answer-display">Apple</div>

        <div class="controls">
            <button class="btn btn-outline" onclick="checkAnswer()" id="checkBtn">👁️ 查看/核对</button>
            <button class="btn" onclick="nextWord()" id="nextBtn">下一词 ➡️</button>
        </div>
    </div>

    <!-- 3. 结果页面 -->
    <div id="resultPage" class="result-section">
        <div class="score-circle" id="finalScore">100</div>
        <h3>听写完成！</h3>
        <div class="word-list" id="resultList">
            <!-- 结果列表 -->
        </div>
        <button class="btn" onclick="location.reload()" style="margin-top: 20px;">🔄 再来一次</button>
    </div>
</div>

<div class="toast" id="toast">提示信息</div>

<script>
    // --- 状态管理 ---
    let words = [];
    let currentIndex = 0;
    let results = []; // 记录 {word: "apple", correct: true/false}
    let settings = {
        speed: 1,
        repeat: 2,
        lang: 'auto',
        mode: 'manual'
    };
    let synth = window.speechSynthesis;
    let autoTimer = null;

    // --- 1. 初始化与解析 ---
    function startDictation() {
        const text = document.getElementById('wordInput').value.trim();
        if (!text) {
            showToast("请先输入单词！");
            return;
        }

        // 解析单词：支持逗号、换行、空格分割，去除空项
        words = text.split(/[\n,，\s]+/).filter(w => w.length > 0);
        
        if (words.length === 0) return;

        // 获取设置
        settings.speed = parseFloat(document.getElementById('speedSelect').value);
        settings.repeat = parseInt(document.getElementById('repeatSelect').value);
        settings.lang = document.getElementById('langSelect').value;
        settings.mode = document.getElementById('modeSelect').value;

        // 切换界面
        document.getElementById('setupPage').style.display = 'none';
        document.getElementById('practicePage').style.display = 'block';
        
        currentIndex = 0;
        results = [];
        updateUI();
        
        // 稍微延迟一下，给用户准备时间
        setTimeout(() => speakCurrentWord(), 800);
    }

    // --- 2. 核心逻辑：UI更新 ---
    function updateUI() {
        document.getElementById('currentIndexDisplay').textContent = currentIndex + 1;
        document.getElementById('totalCountDisplay').textContent = words.length;
        
        // 进度条
        const pct = ((currentIndex) / words.length) * 100;
        document.getElementById('progressBar').style.width = pct + '%';

        // 重置输入框和答案状态
        const input = document.getElementById('spellInput');
        input.value = '';
        input.className = 'input-box';
        input.disabled = false;
        input.focus();

        const ansDiv = document.getElementById('answerDisplay');
        ansDiv.textContent = words[currentIndex];
        ansDiv.classList.remove('visible');

        document.getElementById('checkBtn').style.display = 'inline-block';
        document.getElementById('checkBtn').textContent = "👁️ 查看/核对";
        document.getElementById('nextBtn').style.display = settings.mode === 'auto' ? 'none' : 'inline-block';
    }

    // --- 3. 核心逻辑：朗读 ---
    function speakCurrentWord() {
        if (synth.speaking) synth.cancel();

        const word = words[currentIndex];
        const utterance = new SpeechSynthesisUtterance(word);
        
        utterance.rate = settings.speed;
        
        // 语言检测逻辑
        if (settings.lang === 'auto') {
            // 简单正则：包含中文字符就用中文，否则英文
            utterance.lang = /[\u4e00-\u9fa5]/.test(word) ? 'zh-CN' : 'en-US';
        } else {
            utterance.lang = settings.lang;
        }

        // 动画效果
        const btn = document.getElementById('speakerBtn');
        utterance.onstart = () => btn.classList.add('playing');
        utterance.onend = () => btn.classList.remove('playing');

        // 循环朗读逻辑
        let count = 0;
        function speakLoop() {
            if (count < settings.repeat) {
                synth.speak(utterance);
                count++;
                // 如果还需要读，且不是最后一次，加个间隔
                if (count < settings.repeat) {
                    // 创建一个空的停顿
                    const pause = new SpeechSynthesisUtterance(''); 
                    pause.pause = 1000; // 这里的pause属性不一定生效，用setTimeout模拟更好，但为了简单...
                    // 简单粗暴的方法：直接再次调用speak，中间浏览器会有天然间隔
                    // 为了更可控，我们只speak一次，然后利用onend回调
                }
            }
        }

        // 由于SpeechSynthesis的队列机制，直接循环调用即可
        for(let i=0; i<settings.repeat; i++) {
            synth.speak(utterance);
            // 插入一个静音停顿 (hack)
            if (i < settings.repeat - 1) {
                // 某些浏览器不支持直接pause，这里简单处理，连续读
            }
        }
    }

    // --- 4. 核心逻辑：核对与跳转 ---
    function checkAnswer() {
        const input = document.getElementById('spellInput');
        const userSpelling = input.value.trim();
        const correctSpelling = words[currentIndex];
        const ansDiv = document.getElementById('answerDisplay');

        // 显示答案
        ansDiv.classList.add('visible');
        
        // 判分逻辑
        let isCorrect = false;
        if (userSpelling.toLowerCase() === correctSpelling.toLowerCase()) {
            input.classList.add('correct');
            isCorrect = true;
        } else {
            input.classList.add('wrong');
        }

        // 记录结果（如果还没记录过）
        if (results.length <= currentIndex) {
            results.push({
                word: correctSpelling,
                user: userSpelling,
                isCorrect: isCorrect
            });
        }

        // 按钮变化
        document.getElementById('checkBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'inline-block';

        // 自动模式下的倒计时跳转
        if (settings.mode === 'auto') {
            setTimeout(nextWord, 3000); // 3秒后自动跳
        }
    }

    function nextWord() {
        // 如果用户直接点下一词，没点核对，默认算错（或者不算分，这里简单处理为记录为空）
        if (results.length <= currentIndex) {
             results.push({ word: words[currentIndex], user: "", isCorrect: false });
        }

        currentIndex++;

        if (currentIndex < words.length) {
            updateUI();
            setTimeout(() => speakCurrentWord(), 500);
        } else {
            showResults();
        }
    }

    // --- 5. 结果展示 ---
    function showResults() {
        document.getElementById('practicePage').style.display = 'none';
        document.getElementById('resultPage').style.display = 'block';

        const list = document.getElementById('resultList');
        let correctCount = 0;

        results.forEach(item => {
            if (item.isCorrect) correctCount++;
            
            const div = document.createElement('div');
            div.className = `word-item ${item.isCorrect ? 'correct' : 'wrong'}`;
            div.innerHTML = `
                <span>${item.word}</span>
                <span>${item.isCorrect ? '✅' : '❌ ' + (item.user || '未填')}</span>
            `;
            list.appendChild(div);
        });

        const score = Math.round((correctCount / words.length) * 100);
        document.getElementById('finalScore').textContent = score;
        document.getElementById('finalScore').style.color = score >= 90 ? '#1dd1a1' : (score >= 60 ? '#ff9f43' : '#ff6b6b');
        document.getElementById('finalScore').style.borderColor = document.getElementById('finalScore').style.color;
    }

    // --- 工具 ---
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 3000);
    }

    // 监听回车键，方便操作
    document.addEventListener('keydown', function(e) {
        if (document.getElementById('practicePage').style.display === 'block') {
            if (e.key === 'Enter') {
                const checkBtn = document.getElementById('checkBtn');
                const nextBtn = document.getElementById('nextBtn');
                
                if (checkBtn.style.display !== 'none') {
                    checkAnswer();
                } else if (nextBtn.style.display !== 'none') {
                    nextWord();
                }
            }
        }
    });

</script>
</body>
</html>
